# 本机开发用 MCP 连接 bundle（不随 npm 包分发）
# 与 ../mcp-bundle（官方 npx 形式）等价，但用本机绝对路径，适合包尚未发布时调试。
# 安装：plugin_manager install_bundle target=D:\dingtalk\mcp-bundle-local
- insert:
    - id: im-connector-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: im
        transport: stdio
        command: 'D:\software_setup\nodejs\node.exe'
        args:
          - 'D:\dingtalk\dist\mcp\server.js'
        env:
          DINGTALK_DWS_BIN: 'D:\software_setup\nodejs\node_modules\dingtalk-workspace-cli\bin\dws.js'
          WECOM_CLI_BIN: 'D:\software_setup\nodejs\node_modules\@wecom\cli\bin\wecom.js'
        failOnStartupError: true
