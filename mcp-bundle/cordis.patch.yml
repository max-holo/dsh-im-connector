- insert:
    - id: im-connector-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: im
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js '`${ctx.get("profileContext").dir}/node_modules/im-connector/dist/mcp/server.js`'
        failOnStartupError: true
